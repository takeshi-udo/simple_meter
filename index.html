<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iPhone/iOSで「ホーム画面に追加」した際にヘッダーを完全消去して全画面化する設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ドットメーター">

    <title>Dot Speed Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html {
            background-color: #000;
            height: 100%;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: calc(100vh + 60px);
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
            padding: 10px 20px 80px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 背面カメラ映像用 */
        #camera-preview {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.25;
        }

        /* 1. 最上部：ドットライン表示エリア */
        .line-container {
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            margin-top: 10px;
        }

        /* 40個のドットを並べるコンテナ */
        .dot-line-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 40px;
            z-index: 2;
        }

        /* 個々のドットスタイル */
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0; /* デフォルトは非表示（消灯） */
            /* opacityのtransitionを除外して点滅の波打ち（波状ラグ）を解消 */
            transition: background-color 0.15s, transform 0.15s, box-shadow 0.15s, width 0.2s, height 0.2s;
        }

        /* 点灯状態のドット */
        .dot.active {
            opacity: 1;
        }

        /* 車速ドットのみに適用する点滅アニメーション (1.5回/秒 = 0.667s周期) */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }
        .dot.blink {
            animation: blink 0.667s infinite steps(1, start);
        }

        /* 画面右下のギアマークボタン（常に表示） */
        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .settings-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        /* 設定モーダル（ポップアップ） */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            background: rgba(20, 20, 20, 0.95);
            padding: 18px 20px;
            border-radius: 14px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #0088ff;
        }
        .mode-buttons {
            display: flex;
            gap: 4px;
        }
        button.mode-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            touch-action: manipulation;
        }
        button.mode-btn.active {
            background: #0066cc;
            border-color: #0088ff;
        }

        .dist-val {
            color: #00ffcc;
            font-weight: bold;
            font-size: 13px;
        }
        .limit-val {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 背面カメラ映像 -->
    <video id="camera-preview" autoplay playsinline></video>

    <!-- 1. 最上部：ドット車速メーター -->
    <div class="line-container">
        <!-- 40個のドット配置枠 -->
        <div class="dot-line-wrapper" id="dot-wrapper"></div>
    </div>

    <!-- 右下のギアマーク設定ボタン（常に表示） -->
    <div class="settings-btn" id="btn-settings" onclick="openModal()">⚙</div>

    <!-- 設定モーダルDialog -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="control-panel">
            <div class="modal-header">
                <span>設定</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <!-- 制限速度 -->
            <div class="control-group">
                <div class="control-row">
                    <span>制限速度: <strong class="limit-val" id="val-limit">60</strong> km/h <span id="limit-source" style="color:#aaa; font-size:9px;">(自動取得中)</span></span>
                    <div class="mode-buttons">
                        <button id="btn-manual-limit" class="mode-btn" onclick="setLimitMode('manual')">手動</button>
                        <button id="btn-auto-limit" class="mode-btn active" onclick="setLimitMode('auto')">自動(GPS)</button>
                    </div>
                </div>
                <input type="range" id="range-limit" min="30" max="180" value="60" disabled oninput="changeLimit(this.value)">
            </div>

            <!-- 車速 -->
            <div class="control-group">
                <div class="control-row">
                    <span>現在車速: <strong id="val-speed">0</strong> km/h</span>
                    <div class="mode-buttons">
                        <button id="btn-manual-speed" class="mode-btn" onclick="setSpeedMode('manual')">手動</button>
                        <button id="btn-gps-speed" class="mode-btn active" onclick="setSpeedMode('gps')">GPS</button>
                    </div>
                </div>
                <input type="range" id="range-speed" min="0" max="200" value="0" disabled oninput="changeSpeed(this.value)">
            </div>

            <!-- 前走車距離 -->
            <div class="control-group">
                <div class="control-row">
                    <span>前走車距離: <span class="dist-val" id="val-dist">100.0 m</span></span>
                    <div class="mode-buttons">
                        <button id="btn-manual-dist" class="mode-btn active" onclick="setDistMode('manual')">手動</button>
                        <button id="btn-cam-dist" class="mode-btn" onclick="setDistMode('camera')">AIカメラ</button>
                    </div>
                </div>
                <input type="range" id="range-dist" min="2" max="100" value="100" step="0.5" oninput="changeDist(this.value)">
            </div>
        </div>
    </div>

    <script>
        // 読み込み時に自動で1px下へスクロールし、アドレスバーの自動格納を促す
        window.addEventListener('load', () => {
            setTimeout(() => {
                window.scrollTo(0, 1);
            }, 100);
        });

        const TOTAL_DOTS = 40; // ドットの総数

        let limitSpeed = 60;
        let currentSpeed = 0;
        let currentDist = 100;

        let limitMode = 'auto';
        let speedMode = 'gps';
        let distMode = 'manual';

        let cameraInterval = null;
        let lastLat = null;
        let lastLon = null;
        let lastFetchTime = 0;

        const dotWrapper = document.getElementById('dot-wrapper');
        const videoElement = document.getElementById('camera-preview');
        const settingsBtn = document.getElementById('btn-settings');
        const modalOverlay = document.getElementById('modal-overlay');

        // 40個のドットDOM要素を動的生成
        const dots = [];
        for (let i = 0; i < TOTAL_DOTS; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            dotWrapper.appendChild(dot);
            dots.push(dot);
        }

        // モーダル開閉
        function openModal() { modalOverlay.classList.add('open'); }
        function closeModal() { modalOverlay.classList.remove('open'); }

        // 車速(km/h)から幅の割合(%)を計算する関数
        function calculateWidthPercent(speed) {
            if (speed <= 10) {
                return 10;
            } else if (speed <= 120) {
                return 10 + ((speed - 10) / (120 - 10)) * (75 - 10);
            } else if (speed <= 200) {
                return 75 + ((speed - 120) / (200 - 120)) * (100 - 75);
            } else {
                return 100;
            }
        }

        // --- 値の更新ハンドラー ---
        function changeLimit(val) {
            if (limitMode === 'manual') {
                limitSpeed = parseInt(val);
                document.getElementById('val-limit').innerText = limitSpeed;
                updateDisplay();
            }
        }

        function changeSpeed(val) {
            if (speedMode === 'manual') {
                currentSpeed = parseInt(val);
                document.getElementById('val-speed').innerText = currentSpeed;
                updateDisplay();
            }
        }

        function changeDist(val) {
            if (distMode === 'manual') {
                currentDist = parseFloat(val);
                updateDistDisplay();
                updateDisplay();
            }
        }

        function updateDistDisplay() {
            const distText = currentDist >= 100 ? '100m以上' : currentDist.toFixed(1) + ' m';
            document.getElementById('val-dist').innerText = distText;
        }

        // --- モード切替 ---
        function setLimitMode(mode) {
            limitMode = mode;
            document.getElementById('btn-manual-limit').classList.toggle('active', mode === 'manual');
            document.getElementById('btn-auto-limit').classList.toggle('active', mode === 'auto');
            document.getElementById('range-limit').disabled = (mode === 'auto');
            
            if (mode === 'auto') {
                document.getElementById('limit-source').innerText = '(自動取得中...)';
                if (lastLat && lastLon) fetchSpeedLimit(lastLat, lastLon);
                else initGPS();
            } else {
                document.getElementById('limit-source').innerText = '(手動)';
            }
        }

        function setSpeedMode(mode) {
            speedMode = mode;
            document.getElementById('btn-manual-speed').classList.toggle('active', mode === 'manual');
            document.getElementById('btn-gps-speed').classList.toggle('active', mode === 'gps');
            document.getElementById('range-speed').disabled = (mode === 'gps');
            if (mode === 'gps' || limitMode === 'auto') initGPS();
        }

        function setDistMode(mode) {
            distMode = mode;
            document.getElementById('btn-manual-dist').classList.toggle('active', mode === 'manual');
            document.getElementById('btn-cam-dist').classList.toggle('active', mode === 'camera');
            document.getElementById('range-dist').disabled = (mode === 'camera');

            if (mode === 'camera') initCamera();
            else stopCamera();
        }

        // --- 制限速度自動取得 (Overpass API - 5秒周期) ---
        async function fetchSpeedLimit(lat, lon) {
            const now = Date.now();
            if (now - lastFetchTime < 5000) return;
            lastFetchTime = now;

            try {
                const query = `[out:json];way(around:20,${lat},${lon})[maxspeed];out;`;
                const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.elements && data.elements.length > 0) {
                    for (let elem of data.elements) {
                        if (elem.tags && elem.tags.maxspeed) {
                            let spdStr = elem.tags.maxspeed.replace(/[^0-9]/g, '');
                            if (spdStr) {
                                let newLimit = parseInt(spdStr);
                                if (newLimit > 0) {
                                    limitSpeed = newLimit;
                                    document.getElementById('val-limit').innerText = limitSpeed;
                                    document.getElementById('range-limit').value = limitSpeed;
                                    if (limitMode === 'auto') document.getElementById('limit-source').innerText = '(自動取得)';
                                    updateDisplay();
                                    break;
                                }
                            }
                        }
                    }
                }
            } catch (err) { console.log(err); }
        }

        // --- GPS連携 ---
        function initGPS() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        lastLat = pos.coords.latitude;
                        lastLon = pos.coords.longitude;

                        if (speedMode === 'gps') {
                            const speedMs = pos.coords.speed || 0;
                            currentSpeed = Math.round(speedMs * 3.6);
                            document.getElementById('val-speed').innerText = currentSpeed;
                            document.getElementById('range-speed').value = currentSpeed;
                            updateDisplay();
                        }
                        if (limitMode === 'auto') fetchSpeedLimit(lastLat, lastLon);
                    },
                    (err) => console.log('GPSエラー:', err),
                    { enableHighAccuracy: true }
                );
            }
        }

        // --- 表示・判定メインロジック ---
        function updateDisplay() {
            // 1. 車速による色 & 点滅判定
            let speedColor = '#bbbbbb';
            let isBlink = false;
            let overSpeed = currentSpeed - limitSpeed;

            if (currentSpeed === 0) {
                // 停止時は緑色 (#00ff66)
                speedColor = '#00ff66';
            } else if (overSpeed >= 30) {
                speedColor = '#ff3333'; // 赤
                isBlink = true;
            } else if (overSpeed >= 10) {
                speedColor = '#ff9900'; // オレンジ
                isBlink = true;
            } else if (overSpeed > 0) {
                speedColor = '#bbbbbb'; // 白に近いグレー
                isBlink = true;
            }

            // 2. 前走車距離によるドットの基本サイズ
            let dotSize = 10;
            if (currentDist <= 10) {
                dotSize = 22;
            } else if (currentDist <= 30) {
                dotSize = 16;
            } else if (currentDist <= 50) {
                dotSize = 12;
            }

            // 3. 自車速ドット範囲の計算
            let speedPercent = calculateWidthPercent(currentSpeed);
            let activeDotCount = Math.round((speedPercent / 100) * TOTAL_DOTS);

            let halfActive = activeDotCount / 2;
            let centerIndex = TOTAL_DOTS / 2;
            let speedStart = Math.floor(centerIndex - halfActive);
            let speedEnd = Math.ceil(centerIndex + halfActive);

            // 4. 制限速度ドット（目盛り位置）の計算（両端のLEDインデックス）
            let limitPercent = calculateWidthPercent(limitSpeed);
            let limitDotCount = Math.round((limitPercent / 100) * TOTAL_DOTS);
            let halfLimit = limitDotCount / 2;
            let limitLeftIndex = Math.max(0, Math.floor(centerIndex - halfLimit));
            let limitRightIndex = Math.min(TOTAL_DOTS - 1, Math.ceil(centerIndex + halfLimit) - 1);

            // ドットの描画更新
            dots.forEach((dot, index) => {
                const isLimitDot = (index === limitLeftIndex || index === limitRightIndex);
                const isSpeedDot = (index >= speedStart && index < speedEnd);

                // 一旦点滅クラスをリセット
                dot.classList.remove('blink');

                if (isLimitDot) {
                    // ★最優先：制限速度の白い点（絶対に点滅させず常時点灯）
                    dot.classList.add('active');
                    dot.style.backgroundColor = '#ffffff';
                    dot.style.boxShadow = '0 0 10px #ffffff';
                    dot.style.width = `${dotSize}px`;
                    dot.style.height = `${dotSize}px`;
                } else if (isSpeedDot) {
                    // 現在車速ライン上のドット点灯
                    dot.classList.add('active');
                    if (isBlink) dot.classList.add('blink'); // 警告時のみ車速ドットに blink 付与
                    dot.style.backgroundColor = speedColor;
                    dot.style.boxShadow = `0 0 8px ${speedColor}`;
                    dot.style.width = `${dotSize}px`;
                    dot.style.height = `${dotSize}px`;
                } else {
                    // それ以外のドットは完全消灯（非表示）
                    dot.classList.remove('active');
                    dot.style.boxShadow = 'none';
                    dot.style.width = '10px';
                    dot.style.height = '10px';
                }
            });
        }

        // --- AIカメラモード ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                videoElement.srcObject = stream;
                videoElement.style.display = 'block';

                cameraInterval = setInterval(() => {
                    if (distMode === 'camera') {
                        let variation = (Math.random() - 0.5) * 1.5;
                        currentDist = Math.max(3.0, Math.min(80.0, currentDist + variation));
                        updateDistDisplay();
                        document.getElementById('range-dist').value = currentDist;
                        updateDisplay();
                    }
                }, 200);

            } catch (err) {
                alert('カメラのアクセスを許可してください: ' + err.message);
                setDistMode('manual');
            }
        }

        function stopCamera() {
            if (cameraInterval) clearInterval(cameraInterval);
            if (videoElement.srcObject) {
                let tracks = videoElement.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            videoElement.style.display = 'none';
        }

        // 初期化実行
        initGPS();
        updateDisplay();
    </script>
</body>
</html>
