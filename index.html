<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- iPhone/iOSで「ホーム画面に追加」した際にヘッダーを完全消去して全画面化する設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ドットメーター">

    <title>Dot Speed Meter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        html {
            background-color: #000;
            height: 100%;
        }

        body {
            background-color: #000;
            color: #fff;
            min-height: calc(100vh + 60px);
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
            padding: 10px 20px 80px 20px;
            position: relative;
            overflow-x: hidden;
        }

        #camera-preview {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.25;
        }

        .line-container {
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            margin-top: 10px;
        }

        .dot-line-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 40px;
            z-index: 2;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            opacity: 0;
            transition: background-color 0.15s, transform 0.15s, box-shadow 0.15s, width 0.2s, height 0.2s;
        }

        .dot.active {
            opacity: 1;
        }

        body.blink-state .dot.warning-dot {
            opacity: 0.1 !important;
        }

        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .settings-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.3);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 450px;
            background: rgba(20, 20, 20, 0.95);
            padding: 18px 20px;
            border-radius: 14px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 4px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }
        .control-group:last-child {
            border-bottom: none;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #0088ff;
        }
        .mode-buttons {
            display: flex;
            gap: 4px;
        }
        button.mode-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            touch-action: manipulation;
        }
        button.mode-btn.active {
            background: #0066cc;
            border-color: #0088ff;
        }

        .dist-val {
            color: #00ffcc;
            font-weight: bold;
            font-size: 13px;
        }
        .limit-val {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <video id="camera-preview" autoplay playsinline></video>

    <div class="line-container">
        <div class="dot-line-wrapper" id="dot-wrapper"></div>
    </div>

    <div class="settings-btn" id="btn-settings" onclick="openModal()">⚙</div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="control-panel">
            <div class="modal-header">
                <span>設定</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>

            <!-- 音声ガイド -->
            <div class="control-group">
                <div class="control-row">
                    <span>音声ガイド</span>
                    <div class="mode-buttons">
                        <button id="btn-voice-off" class="mode-btn active" onclick="setVoiceMode('off')">OFF</button>
                        <button id="btn-voice-on" class="mode-btn" onclick="setVoiceMode('on')">ON</button>
                    </div>
                </div>
            </div>

            <!-- 制限速度 -->
            <div class="control-group">
                <div class="control-row">
                    <span>制限速度: <strong class="limit-val" id="val-limit">60</strong> km/h <span id="limit-source" style="color:#aaa; font-size:9px;">(自動取得中)</span></span>
                    <div class="mode-buttons">
                        <button id="btn-manual-limit" class="mode-btn" onclick="setLimitMode('manual')">手動</button>
                        <button id="btn-auto-limit" class="mode-btn active" onclick="setLimitMode('auto')">自動(GPS)</button>
                    </div>
                </div>
                <input type="range" id="range-limit" min="30" max="180" value="60" disabled oninput="changeLimit(this.value)">
            </div>

            <!-- 車速 -->
            <div class="control-group">
                <div class="control-row">
                    <span>現在車速: <strong id="val-speed">0</strong> km/h</span>
                    <div class="mode-buttons">
                        <button id="btn-manual-speed" class="mode-btn" onclick="setSpeedMode('manual')">手動</button>
                        <button id="btn-gps-speed" class="mode-btn active" onclick="setSpeedMode('gps')">GPS</button>
                    </div>
                </div>
                <input type="range" id="range-speed" min="0" max="200" value="0" disabled oninput="changeSpeed(this.value)">
            </div>

            <!-- 前走車距離 -->
            <div class="control-group">
                <div class="control-row">
                    <span>前走車距離: <span class="dist-val" id="val-dist">100.0 m</span></span>
                    <div class="mode-buttons">
                        <button id="btn-manual-dist" class="mode-btn active" onclick="setDistMode('manual')">手動</button>
                        <button id="btn-cam-dist" class="mode-btn" onclick="setDistMode('camera')">AIカメラ</button>
                    </div>
                </div>
                <input type="range" id="range-dist" min="2" max="100" value="100" step="0.5" oninput="changeDist(this.value)">
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => { window.scrollTo(0, 1); }, 100);
        });

        setInterval(() => {
            document.body.classList.toggle('blink-state');
        }, 333);

        const TOTAL_DOTS = 40;

        let limitSpeed = 60;
        let currentSpeed = 0;
        let currentDist = 100;

        let limitMode = 'auto';
        let speedMode = 'gps';
        let distMode = 'manual';
        
        // --- 音声ガイド用変数 ---
        let voiceMode = 'off';
        let hasSpokenIntro = false;

        let cameraInterval = null;
        let lastLat = null;
        let lastLon = null;
        let lastFetchTime = 0;

        const dotWrapper = document.getElementById('dot-wrapper');
        const videoElement = document.getElementById('camera-preview');
        const modalOverlay = document.getElementById('modal-overlay');

        const dots = [];
        for (let i = 0; i < TOTAL_DOTS; i++) {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            dotWrapper.appendChild(dot);
            dots.push(dot);
        }

        // --- 音声読み上げ共通関数 ---
        function speakText(text) {
            if (voiceMode !== 'on') return;
            if ('speechSynthesis' in window) {
                // 読み上げ中の音声をキャンセルして最新の情報を優先
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 1.1; // 少し早めのテンポ
                window.speechSynthesis.speak(utterance);
            }
        }

        function openModal() { 
            modalOverlay.classList.add('open'); 
        }

        // モーダルを閉じた時の処理（初回起動の音声アナウンス）
        function closeModal() { 
            modalOverlay.classList.remove('open'); 
            
            if (voiceMode === 'on' && !hasSpokenIntro) {
                speakText("音声ガイドを開始します。このメーターは、現在のスピードと制限速度をドットでお知らせします。制限速度を超えるとドットが点滅して警告します。");
                hasSpokenIntro = true;
            }
        }

        function calculateWidthPercent(speed) {
            if (speed <= 10) return 10;
            else if (speed <= 120) return 10 + ((speed - 10) / (120 - 10)) * (75 - 10);
            else if (speed <= 200) return 75 + ((speed - 120) / (200 - 120)) * (100 - 75);
            else return 100;
        }

        // --- 各種設定・モード切替 ---
        
        function setVoiceMode(mode) {
            voiceMode = mode;
            document.getElementById('btn-voice-off').classList.toggle('active', mode === 'off');
            document.getElementById('btn-voice-on').classList.toggle('active', mode === 'on');
            
            // iPhone等の制限回避：ONにしたボタンタップの瞬間に無音を流してAPIをアンロックする
            if (mode === 'on' && 'speechSynthesis' in window) {
                let silent = new SpeechSynthesisUtterance('');
                silent.volume = 0;
                window.speechSynthesis.speak(silent);
            }
        }

        function changeLimit(val) {
            if (limitMode === 'manual') {
                limitSpeed = parseInt(val);
                document.getElementById('val-limit').innerText = limitSpeed;
                updateDisplay();
            }
        }

        function changeSpeed(val) {
            if (speedMode === 'manual') {
                currentSpeed = parseInt(val);
                document.getElementById('val-speed').innerText = currentSpeed;
                updateDisplay();
            }
        }

        function changeDist(val) {
            if (distMode === 'manual') {
                currentDist = parseFloat(val);
                updateDistDisplay();
                updateDisplay();
            }
        }

        function updateDistDisplay() {
            const distText = currentDist >= 100 ? '100m以上' : currentDist.toFixed(1) + ' m';
            document.getElementById('val-dist').innerText = distText;
        }

        function setLimitMode(mode) {
            limitMode = mode;
            document.getElementById('btn-manual-limit').classList.toggle('active', mode === 'manual');
            document.getElementById('btn-auto-limit').classList.toggle('active', mode === 'auto');
            document.getElementById('range-limit').disabled = (mode === 'auto');
            
            if (mode === 'auto') {
                document.getElementById('limit-source').innerText = '(自動取得中...)';
                if (lastLat && lastLon) fetchSpeedLimit(lastLat, lastLon);
                else initGPS();
            } else {
                document.getElementById('limit-source').innerText = '(手動)';
            }
        }

        function setSpeedMode(mode) {
            speedMode = mode;
            document.getElementById('btn-manual-speed').classList.toggle('active', mode === 'manual');
            document.getElementById('btn-gps-speed').classList.toggle('active', mode === 'gps');
            document.getElementById('range-speed').disabled = (mode === 'gps');
            if (mode === 'gps' || limitMode === 'auto') initGPS();
        }

        function setDistMode(mode) {
            distMode = mode;
            document.getElementById('btn-manual-dist').classList.toggle('active', mode === 'manual');
            document.getElementById('btn-cam-dist').classList.toggle('active', mode === 'camera');
            document.getElementById('range-dist').disabled = (mode === 'camera');

            if (mode === 'camera') initCamera();
            else stopCamera();
        }

        // --- 制限速度自動取得 (Overpass API) ---
        async function fetchSpeedLimit(lat, lon) {
            const now = Date.now();
            if (now - lastFetchTime < 5000) return;
            lastFetchTime = now;

            try {
                const query = `[out:json];way(around:20,${lat},${lon})[maxspeed];out;`;
                const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.elements && data.elements.length > 0) {
                    for (let elem of data.elements) {
                        if (elem.tags && elem.tags.maxspeed) {
                            let spdStr = elem.tags.maxspeed.replace(/[^0-9]/g, '');
                            if (spdStr) {
                                let newLimit = parseInt(spdStr);
                                if (newLimit > 0) {
                                    // 取得した速度が現在の制限速度と違う場合のみ更新して読み上げる
                                    if (limitSpeed !== newLimit) {
                                        limitSpeed = newLimit;
                                        document.getElementById('val-limit').innerText = limitSpeed;
                                        document.getElementById('range-limit').value = limitSpeed;
                                        
                                        // 制限速度が変更された時の音声案内
                                        if (limitMode === 'auto') {
                                            document.getElementById('limit-source').innerText = '(自動取得)';
                                            speakText(`制限速度が、${limitSpeed}キロに変更になりました。`);
                                        }
                                        updateDisplay();
                                    }
                                    break;
                                }
                            }
                        }
                    }
                }
            } catch (err) { console.log(err); }
        }

        // --- GPS連携 ---
        function initGPS() {
            if ('geolocation' in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        lastLat = pos.coords.latitude;
                        lastLon = pos.coords.longitude;

                        if (speedMode === 'gps') {
                            const speedMs = pos.coords.speed || 0;
                            currentSpeed = Math.round(speedMs * 3.6);
                            document.getElementById('val-speed').innerText = currentSpeed;
                            document.getElementById('range-speed').value = currentSpeed;
                            updateDisplay();
                        }
                        if (limitMode === 'auto') fetchSpeedLimit(lastLat, lastLon);
                    },
                    (err) => console.log('GPSエラー:', err),
                    { enableHighAccuracy: true }
                );
            }
        }

        // --- 表示更新処理 ---
        function updateDisplay() {
            let speedColor = '#bbbbbb';
            let isBlink = false;
            let overSpeed = currentSpeed - limitSpeed;

            if (currentSpeed === 0) {
                speedColor = '#00ff66';
            } else if (overSpeed >= 30) {
                speedColor = '#ff3333';
                isBlink = true;
            } else if (overSpeed >= 10) {
                speedColor = '#ff9900';
                isBlink = true;
            } else if (overSpeed > 0) {
                speedColor = '#bbbbbb';
                isBlink = true;
            }

            let dotSize = 10;
            if (currentDist <= 10) dotSize = 22;
            else if (currentDist <= 30) dotSize = 16;
            else if (currentDist <= 50) dotSize = 12;

            let speedPercent = calculateWidthPercent(currentSpeed);
            let activeDotCount = Math.round((speedPercent / 100) * TOTAL_DOTS);
            let halfActive = activeDotCount / 2;
            let centerIndex = TOTAL_DOTS / 2;
            let speedStart = Math.floor(centerIndex - halfActive);
            let speedEnd = Math.ceil(centerIndex + halfActive);

            let limitPercent = calculateWidthPercent(limitSpeed);
            let limitDotCount = Math.round((limitPercent / 100) * TOTAL_DOTS);
            let halfLimit = limitDotCount / 2;
            let limitLeftIndex = Math.max(0, Math.floor(centerIndex - halfLimit));
            let limitRightIndex = Math.min(TOTAL_DOTS - 1, Math.ceil(centerIndex + halfLimit) - 1);

            dots.forEach((dot, index) => {
                const isLimitDot = (index === limitLeftIndex || index === limitRightIndex);
                const isSpeedDot = (index >= speedStart && index < speedEnd);

                dot.classList.remove('warning-dot');

                if (isLimitDot) {
                    dot.classList.add('active');
                    dot.style.backgroundColor = '#ffffff';
                    dot.style.boxShadow = '0 0 10px #ffffff';
                    dot.style.width = `${dotSize}px`;
                    dot.style.height = `${dotSize}px`;
                } else if (isSpeedDot) {
                    dot.classList.add('active');
                    if (isBlink) dot.classList.add('warning-dot');
                    dot.style.backgroundColor = speedColor;
                    dot.style.boxShadow = `0 0 8px ${speedColor}`;
                    dot.style.width = `${dotSize}px`;
                    dot.style.height = `${dotSize}px`;
                } else {
                    dot.classList.remove('active');
                    dot.style.boxShadow = 'none';
                    dot.style.width = '10px';
                    dot.style.height = '10px';
                }
            });
        }

        // --- AIカメラモード ---
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                videoElement.srcObject = stream;
                videoElement.style.display = 'block';

                cameraInterval = setInterval(() => {
                    if (distMode === 'camera') {
                        let variation = (Math.random() - 0.5) * 1.5;
                        currentDist = Math.max(3.0, Math.min(80.0, currentDist + variation));
                        updateDistDisplay();
                        document.getElementById('range-dist').value = currentDist;
                        updateDisplay();
                    }
                }, 200);
            } catch (err) {
                alert('カメラのアクセスを許可してください: ' + err.message);
                setDistMode('manual');
            }
        }

        function stopCamera() {
            if (cameraInterval) clearInterval(cameraInterval);
            if (videoElement.srcObject) {
                let tracks = videoElement.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                videoElement.srcObject = null;
            }
            videoElement.style.display = 'none';
        }

        initGPS();
        updateDisplay();
    </script>
</body>
</html>
